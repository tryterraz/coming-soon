<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F0E4E6">
  <meta name="description" content="طراز — قريباً">
  <title>طراز | Coming Soon</title>
  <style>
    :root {
      color-scheme: light;
      --maroon: #63192A;
      --background: #F0E4E6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      background: var(--background);
      color: var(--maroon);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      text-align: center;
    }

    .content {
      width: min(680px, 100%);
    }

    .logo {
      display: block;
      width: clamp(170px, 30vw, 285px);
      height: auto;
      margin: 0 auto 30px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.03em;
    }

    .arabic {
      margin: 14px 0 0;
      font-family: Tahoma, Arial, sans-serif;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 400;
      line-height: 1.4;
    }

    @media (max-width: 480px) {
      .page {
        padding-inline: 18px;
      }

      .logo {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="content" aria-labelledby="coming-soon-title">
      <img class="logo" src="assets/terraz-logo.png" alt="طراز terraz">
      <h1 id="coming-soon-title" dir="ltr">Coming Soon</h1>
      <p class="arabic">قريباً</p>
    </section>
  </main>
</body>
</html>
